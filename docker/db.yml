services:
  db:
    image: postgres:16
    container_name: monitoring-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER: admin
      - POSTGRES_PASSWORD: admin_password
      - POSTGRES_DB: monitoring_db
    ports:
      - 5432:5432
    volumes:
      - monitoring_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit_db"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  monitoring_db_data:


