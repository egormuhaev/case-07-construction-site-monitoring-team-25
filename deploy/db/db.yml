services:
  db:
    image: pgvector/pgvector:pg16
    container_name: monitoring-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: monitoring_db
    ports:
      - 5432:5432
    volumes:
      - monitoring_db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d monitoring_db"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  monitoring_db_data:


