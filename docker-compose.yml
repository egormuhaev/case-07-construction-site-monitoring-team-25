services:
  db:
    extends:
      file: ./deploy/db/db.yml
      service: db

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  orchestrator:
    restart: unless-stopped
    build:
      context: ./orchestrator/orchestrator
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TTL_SECONDS: 604800
      PIPELINE_CONFIG_PATH: /app/config/pipeline.json
      SERVICE_TIMEOUT_MS: 15000
      SERVICE_RETRY_BASE_DELAY_MS: 5000
      SERVICE_RETRY_MAX_DELAY_MS: 300000
      DISPATCH_INTERVAL_MS: 1000
      DISPATCH_LEASE_MS: 60000
      DISPATCH_RETRY_DELAY_MS: 5000
      ORCHESTRATOR_CONCURRENCY: 10
      DB_SYNCHRONIZE: "true"
    volumes:
      - ./orchestrator/shared:/data
      - ./orchestrator/orchestrator/config:/app/config:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  monitoring_db_data:
  postgres-data:
  redis-data:
