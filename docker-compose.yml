services:
  db:
    extends:
      file: ./deploy/db/db.yml
      service: db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  orchestrator:
    restart: unless-stopped
    build:
      context: ./orchestrator/orchestrator
    environment:
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TTL_SECONDS: 604800
      PIPELINE_CONFIG_PATH: /app/config/pipeline.json
      SERVICE_TIMEOUT_MS: 15000
      SERVICE_RETRY_BASE_DELAY_MS: 5000
      SERVICE_RETRY_MAX_DELAY_MS: 300000
      DISPATCH_INTERVAL_MS: 1000
      DISPATCH_LEASE_MS: 60000
      DISPATCH_RETRY_DELAY_MS: 5000
      ORCHESTRATOR_CONCURRENCY: 10
      DB_SYNCHRONIZE: "true"
    volumes:
      - ./orchestrator/shared:/data
      - ./orchestrator/orchestrator/config:/app/config:ro
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  detecting:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/detecting/Dockerfile
    env_file:
      - .env
    environment:
      DETECTING_REDIS_HOST: redis
      DETECTING_DATA_DIR: /data
      DETECTING_WEIGHTS_DIR: /weights
      DETECTING_CACHE_DIR: /cache
    volumes:
      - ./orchestrator/shared:/data
      - detecting-weights:/weights
      - detecting-cache:/cache
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  monitoring_db_data:
  redis-data:
  detecting-weights:
  detecting-cache:
