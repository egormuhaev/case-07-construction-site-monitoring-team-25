server {
    listen 80;
    server_name _;
    client_max_body_size 200m;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://core-api:3000/api/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 200m;
    }

    location /health {
        proxy_pass http://core-api:3000/health;
    }

    location / {
        try_files $uri /index.html;
    }
}
