[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoring-construction-site"
version = "0.1.0"
description = "Мониторинг строительной площадки: детекция и группировка ракурсов"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy",
    "pillow",
    "scikit-learn",
    "sentence-transformers",
    "torch",
    "torchvision",
    "tqdm",
    "transformers",
    "ultralytics",
    "yolov5",
    "hdbscan",
    "fastapi",
    "uvicorn[standard]",
    "redis",
    "pydantic-settings",
    "httpx",
]

[project.optional-dependencies]
calendar = [
    "faiss-cpu",
    "ijson",
    "ipykernel",
    "JPype1",
    "mpxj",
    "openpyxl",
    "polars",
    "psycopg[binary]",
    "pypdfium2",
]

[project.scripts]
detecting = "detecting.main:main"

[tool.setuptools.packages.find]
where = ["services"]
include = ["detecting*"]

[tool.pyright]
extraPaths = ["services"]
venvPath = "."
venv = ".venv"
exclude = [
    "**/.venv",
    "**/dataset",
    "**/weights",
    "**/__pycache__",
    "**/.eggs",
    "**/build",
    "**/dist",
]
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = ["services"]
